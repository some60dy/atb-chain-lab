# ATB kill-chain detections. One correlation search per stage.
# All run over: index=atb sourcetype=atb:json

[ATB 01a - Hard-coded mobile API credentials used]
search = index=atb event=mobapp.hardcoded_cred_used | stats count min(_time) as first by src_ip user
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 01b - Unauthenticated Moodle config disclosure]
search = index=atb event=education.config_disclosure | table _time src_ip host msg
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 02 - SQL injection on www (boolean oracle)]
search = index=atb (event=www.sqli_error OR event=www.sqli_probe_true) | bin _time span=1m | stats count values(filter_key) as keys by _time src_ip | where count > 5
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 03 - Supplier portal self-registration + reset abuse]
search = index=atb (event=supplier.self_registration OR event=supplier.password_reset_link OR event=supplier.password_changed) | transaction src_ip maxspan=10m | where eventcount >= 2
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 04 - LFI reading sensitive server files]
search = index=atb event=supplier.lfi_read (importFile="*config*" OR importFile="/etc/*" OR importFile="/proc/*") | table _time src_ip importFile msg
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 05 - WAF bypass + phar deserialization web-shell]
search = index=atb (event=supplier.waf_bypass OR event=supplier.phar_deserialization_rce OR event=supplier.webshell_exec) | table _time src_ip event cmd importFile msg
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 06 - Reused creds to Grafana then Zabbix DB write]
search = index=atb (event=grafana.login_reused_creds OR event=grafana.zabbix_db_write OR event=zabbix.session_inserted) | stats values(event) as chain by src_ip
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 06b - Forged Zabbix session -> RCE as root]
search = index=atb (event=zabbix.forged_session_accepted OR event=zabbix.script_create_rce) | table _time src_ip command output msg
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 07 - Zabbix agent system.run on Jenkins]
search = index=atb event=jenkins.zbxd_system_run | table _time src_ip cmd bytes msg
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 07b - Root SSH via recovered backup key]
search = index=atb event=ssh.login_root_key | stats count by host src_ip user
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 08 - DB credentials leaked from Harbor images]
search = index=atb event=harbor.creds_in_layer | table _time src_ip repo secret msg
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 08b - Oracle production DB auth from portal host]
search = index=atb event=oracle.auth_ok | stats count by instance user src_ip
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 08c - Active Directory bind with reused service creds]
search = index=atb event=ad.bind_reused_creds | table _time src_ip bind_dn
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 09 - Exchange EWS access with stolen mailbox creds]
search = index=atb event=exchange.ews_auth | table _time src_ip user
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
enableSched = 1

[ATB 99 - Full kill-chain timeline]
search = index=atb | sort 0 _time | table _time host service event src_ip msg
dispatch.earliest_time = -24h
cron_schedule = */10 * * * *
enableSched = 0
