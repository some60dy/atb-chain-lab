# Lab squid: trusted /28 pivot. Intentionally permissive so the attacker can
# reach internal hosts through it (step 7). Do not use outside the lab.
http_port 3128
acl all_lab src 0.0.0.0/0
http_access allow all_lab
http_access allow all
via off
forwarded_for delete
access_log stdio:/var/log/atb/squid.json squid
