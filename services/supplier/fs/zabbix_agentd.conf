# Zabbix agent 6.0 — managed by ansible role zbx-agent (template: atb-linux-prod)
PidFile=/run/zabbix/zabbix_agentd.pid
LogFile=/var/log/zabbix/zabbix_agentd.log
# passive checks only from the monitoring server
Server=zb-app-p01
ServerActive=zb-app-p01
Hostname=sp-web-p01
# remote commands are needed for the "restart php-fpm" action — same template on every prod host
AllowKey=system.run[*]
# dashboards: http://grafana.atbmarket.com:3000  (login = your corporate e-mail)
# frontend:   http://zabbix.atbmarket.com:8080
