# ATB Market attack-chain lab. Single bridge network `atb`; the documented
# production IPs live as network aliases so the scenario hostnames resolve.
# All structured events land in ./logs (bind-mounted) and are ingested by Splunk.

x-app: &app
  restart: unless-stopped
  networks: [atb]
  volumes:
    - ./logs:/var/log/atb

networks:
  atb:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
          ip_range: 172.31.128.0/17     # dynamic IPs; 172.31.0.x is for pinned hosts

services:
  # ------------------------------------------------------------- databases
  ishop-db:
    image: mysql:8.4
    container_name: ishop-db
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ISHOP_DB}
      MYSQL_USER: ${ISHOP_USER}
      MYSQL_PASSWORD: ${ISHOP_PASS}
    volumes:
      - ./seed/mysql-ishop:/docker-entrypoint-initdb.d:ro
    networks:
      atb:
        aliases: [api.zakaz.atbmarket.com, db-ishop-p01]
    restart: unless-stopped

  supplier-db:
    image: mysql:8.4
    container_name: supplier-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SUPPLIER_DB}
      MYSQL_USER: ${SUPPLIER_USER}
      MYSQL_PASSWORD: ${SUPPLIER_PASS}
    volumes:
      - ./seed/mysql-supplier:/docker-entrypoint-initdb.d:ro
    networks:
      atb:
        aliases: [supplier-db.atbmarket.com]
    restart: unless-stopped

  education-db:
    image: mysql:8.4
    container_name: education-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MOODLE_DB}
      MYSQL_USER: ${MOODLE_USER}
      MYSQL_PASSWORD: ${MOODLE_PASS}
    volumes:
      - ./seed/mysql-moodle:/docker-entrypoint-initdb.d:ro
    networks: [atb]
    restart: unless-stopped

  # Zabbix frontend DB. The `grafana` DB user is over-privileged (can INSERT a
  # forged admin session); the forged-session HMAC key lives in config.session_key.
  zabbix-db:
    image: mysql:8.4
    container_name: zabbix-db
    command: ["--mysql-native-password=ON", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # db + zabbix/grafana accounts come from the seed
    volumes:
      - ./seed/mysql-zabbix:/docker-entrypoint-initdb.d:ro
    networks:
      atb:
        aliases: [zabbix-db.atbmarket.com]
    restart: unless-stopped

  storeplus-db:
    image: postgres:16
    container_name: storeplus-db
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      atb:
        aliases: [pgsql-dev.store-plus.atbmarket.com]
    restart: unless-stopped

  # ------------------------------------------------------- web/app services
  mobapp:
    <<: *app
    build: {context: ., dockerfile: services/mobapp/Dockerfile}
    container_name: mobapp
    hostname: mobapp.atbmarket.com
    ports: ["${MOBAPP_PORT:-8081}:80"]
    networks: {atb: {aliases: [mobapp.atbmarket.com]}}

  education:
    <<: *app
    build: {context: ., dockerfile: services/education/Dockerfile}
    container_name: education
    hostname: education.atbmarket.com
    environment:
      MOODLE_DB_HOST: education-db
      MOODLE_DB_NAME: ${MOODLE_DB}
      MOODLE_DB_USER: ${MOODLE_USER}
      MOODLE_DB_PASS: ${MOODLE_PASS}
    ports: ["${EDU_PORT:-8082}:80"]
    networks: {atb: {aliases: [education.atbmarket.com]}}

  www:
    <<: *app
    build: {context: ., dockerfile: services/www/Dockerfile}
    container_name: www
    hostname: www.atbmarket.com
    environment:
      ISHOP_DB_HOST: ishop-db
      ISHOP_DB_USER: ${ISHOP_USER}
      ISHOP_DB_PASS: ${ISHOP_PASS}
      ISHOP_DB_NAME: ${ISHOP_DB}
      PORTAL_PORTS: "${MOBAPP_PORT:-8081},${EDU_PORT:-8082},${SUPPLIER_PORT:-8083},${OWA_PORT:-8444}"
    depends_on: [ishop-db]
    ports: ["${WWW_PORT:-8080}:80"]
    networks: {atb: {aliases: [www.atbmarket.com]}}

  supplier:
    <<: *app
    build: {context: ., dockerfile: services/supplier/Dockerfile}
    container_name: supplier
    hostname: sp-web-p01
    ports: ["${SUPPLIER_PORT:-8083}:80"]
    networks: {atb: {aliases: [supplier.atbmarket.com, sp-web-p01]}}

  grafana:
    <<: *app
    build: {context: ., dockerfile: services/grafana/Dockerfile}
    container_name: grafana
    hostname: grafana.atbmarket.com
    environment:
      ZABBIX_DB_HOST: zabbix-db
      ZABBIX_DB_NAME: zabbix
      ZABBIX_DB_USER: ${ZABBIX_DB_USER}
      ZABBIX_DB_PASS: ${ZABBIX_DB_PASS}
      ZABBIX_URL: http://zabbix
    depends_on: [zabbix-db]
    networks: {atb: {aliases: [grafana.atbmarket.com]}}

  # Real Zabbix 6.0 LTS (official images). Server = zb-app-p01 (AllowRoot=1),
  # frontend = zabbix.atbmarket.com:8080, zabbix-init provisions the estate once.
  zabbix:
    build: {context: ., dockerfile: services/zabbix/Dockerfile}
    container_name: zabbix
    hostname: zb-app-p01
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: ${ZBX_SRV_DB_USER}
      MYSQL_PASSWORD: ${ZBX_SRV_DB_PASS}
      ZBX_ALLOWUNSUPPORTEDDBVERSIONS: "1"
      ZBX_STARTPOLLERS: "10"
      ZBX_STARTPOLLERSUNREACHABLE: "3"
      ZBX_TIMEOUT: "10"
    depends_on: [zabbix-db]
    networks: {atb: {aliases: [zb-app-p01]}}
    restart: unless-stopped

  zabbix-web:
    build: {context: ., dockerfile: services/zabbix-web/Dockerfile}
    container_name: zabbix-web
    hostname: zabbix.atbmarket.com
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: ${ZBX_SRV_DB_USER}
      MYSQL_PASSWORD: ${ZBX_SRV_DB_PASS}
      ZBX_SERVER_HOST: zb-app-p01
      ZBX_SERVER_NAME: ATB Monitoring
      PHP_TZ: Europe/Kyiv
    depends_on: [zabbix]
    networks: {atb: {aliases: [zabbix.atbmarket.com, zabbix-web]}}
    restart: unless-stopped

  zabbix-init:
    build: {context: ., dockerfile: services/zabbix-init/Dockerfile}
    container_name: zabbix-init
    depends_on: [zabbix-web]
    networks: [atb]
    restart: on-failure

  oracle-mocks:
    <<: *app
    build: {context: ., dockerfile: services/oracle-mocks/Dockerfile}
    container_name: oracle-mocks
    hostname: oracle-db
    networks: {atb: {aliases: [erpdb, retaildb, ISMEDOC-DB]}}

  exchange:
    <<: *app
    build: {context: ., dockerfile: services/exchange/Dockerfile}
    container_name: exchange
    hostname: ex.atbmarket.com
    ports: ["${OWA_PORT:-8444}:80"]
    networks: {atb: {aliases: [ex.atbmarket.com]}}

  ad-ldap:
    <<: *app
    build: {context: ., dockerfile: services/ad-ldap/Dockerfile}
    container_name: ad-ldap
    hostname: DC-MAIN-01
    networks: {atb: {aliases: [DC-MAIN-01.atbmarket.com]}}

  harbor:
    <<: *app
    build: {context: ., dockerfile: services/harbor/Dockerfile}
    container_name: harbor
    hostname: sh-harb-p01
    networks: {atb: {aliases: [sh-harb-p01, harbor.atbmarket.com]}}

  jenkins:
    <<: *app
    build: {context: ., dockerfile: services/jenkins/Dockerfile}
    container_name: jenkins
    hostname: jenkins.atbmarket.com
    volumes:
      - ./logs:/var/log/atb
      - ./backup-seed:/mnt/BACKUP:ro      # CIFS //bkp-atman/BACKUP stand-in
    networks: {atb: {aliases: [jenkins.atbmarket.com]}}

  # ------------------------------------------------------- ssh / pivot hosts
  bastion:
    build: {context: ., dockerfile: services/bastion/Dockerfile}
    container_name: bastion
    hostname: bastion-main-p01
    volumes: [./logs:/var/log/atb]
    # pinned: gitlab's sshd only accepts root logins from the bastion
    networks: {atb: {aliases: [bastion-main-p01], ipv4_address: 172.31.0.10}}
    restart: unless-stopped

  gitlab:
    build: {context: ., dockerfile: services/gitlab/Dockerfile}
    container_name: gitlab
    hostname: gitlab-p01
    volumes: [./logs:/var/log/atb]
    networks: {atb: {aliases: [gitlab-p01.atbmarket.com, gitlab.atbmarket.com]}}
    restart: unless-stopped

  squid:
    image: ubuntu/squid:latest
    container_name: squid
    volumes:
      - ./services/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./logs:/var/log/atb
    networks: {atb: {aliases: [squid-proxy]}}
    restart: unless-stopped

  # ------------------------------------------------------------------ SIEM
  splunk:
    image: splunk/splunk:9.3
    container_name: splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
    volumes:
      - ./logs:/var/log/atb:ro
      - ./splunk/apps/atb_inputs:/opt/splunk/etc/apps/atb_inputs
      - splunk-var:/opt/splunk/var
    ports: ["${SPLUNK_PORT:-8000}:8000"]
    networks: {atb: {aliases: [splunk]}}
    restart: unless-stopped

volumes:
  splunk-var:
